version: 2
updates:
  - package-ecosystem: "github-actions"   # keeps the SHA pins in security.yml current
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7        # supply-chain buffer against brand-new releases
    open-pull-requests-limit: 5
